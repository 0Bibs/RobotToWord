name: Gerar RobotToWord.exe

# Empacota o painel em um executavel Windows unico. Roda em um runner Windows
# do proprio GitHub, entao ninguem precisa de Python para gerar o .exe.
on:
  push:
    branches:
      - claude/automate-screenshots-to-word-4avelq
    paths:
      - "painel.py"
      - "robot_to_word.py"
      - "requirements.txt"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Empacotar
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed
          --name RobotToWord painel.py

      - name: Conferir que o executavel abre
        # Sobe o painel por alguns segundos e encerra: pega erro de dependencia
        # que so aparece no executavel empacotado.
        shell: pwsh
        run: |
          $exe = Start-Process -FilePath dist\RobotToWord.exe -PassThru
          Start-Sleep -Seconds 25
          if ($exe.HasExited) {
            Write-Error "O executavel encerrou sozinho (codigo $($exe.ExitCode))."
            exit 1
          }
          Stop-Process -Id $exe.Id -Force
          Write-Host "O executavel subiu e continuou rodando."

      - uses: actions/upload-artifact@v4
        with:
          name: RobotToWord-exe
          path: dist/RobotToWord.exe
          retention-days: 90
